$kind: http-request
name: Process Payment
method: POST
url: "{{baseUrl}}/api/v1/payment/pay"
order: 1000
headers:
  Content-Type: application/json
  X-Idempotency-Key: "{{$guid}}"
body:
  type: json
  content: |-
    {
      "invoiceId": "786d8548-d7bf-48b4-8085-9c5ba50cfdd3",
      "amount": 99999.99,
      "paymentDate": "2026-05-05T00:00:00Z"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
