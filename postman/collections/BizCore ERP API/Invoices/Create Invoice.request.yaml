$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/invoice'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "customerName": "Acme Corp",
      "amount": 1500.50
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
