  identity-api:
    image: bizcore-identity-api
    container_name: bizcore-identity
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=IdentityDb;User Id=sa;Password=Password123!;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - Loki__Url=http://loki:3100
      - Jwt__SecretKey=BizcoreERPSecretKeyMustBeVeryLongAndSecure!!!
    depends_on:
      - sql-server
      - rabbitmq
      - redis
      # - loki

  audit-api:
    image: bizcore-audit-api
    container_name: bizcore-audit
    build:
      context: .
      dockerfile: src/Services/Audit/Audit.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=AuditDb;User Id=sa;Password=Password123!;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - Loki__Url=http://loki:3100
      - Jwt__SecretKey=BizcoreERPSecretKeyMustBeVeryLongAndSecure!!!
      - Retention__HotDays=180
    depends_on:
      - sql-server
      - rabbitmq
      - redis
      # - loki

  web-ui:
    image: bizcore-web-ui
    container_name: bizcore-web
    build:
      context: ./src/WebUI
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - gateway-api

volumes:
  portainer_data:

