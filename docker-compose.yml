services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bizcore-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1433:1433"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bizcore-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: bizcore-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: bizcore-portainer
    restart: always
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
