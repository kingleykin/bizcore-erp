global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bizcore-erp'

scrape_configs:
  - job_name: 'gateway-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bizcore-gateway:8080']

  - job_name: 'invoice-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['invoice-api:8080']

  - job_name: 'payment-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['payment-api:8080']

  - job_name: 'report-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bizcore-report:8080']

  - job_name: 'admin-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bizcore-admin:8080']

  - job_name: 'audit-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bizcore-audit:8080']

  - job_name: 'orchestration-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bizcore-orchestration:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
